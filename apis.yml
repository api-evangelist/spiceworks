description: >-
  Spiceworks is an online community and marketplace where IT professionals can find advice, manage their networks, and
  discover and purchase IT products and services. The Spiceworks Cloud Apps API enables developers to build integrated
  applications within the Spiceworks platform, accessing Help Desk ticketing, device inventory, and user management data
  through a JavaScript SDK with OAuth-based authentication.
